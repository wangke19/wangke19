name: Update GitHub Stats

on:
  schedule:
    - cron: '0 0 * * *'  # Runs daily at midnight UTC
  workflow_dispatch:      # Allows manual trigger

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Generate stats card SVG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: go run generate-stats-card.go

      - name: Commit stats card to output branch
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

          # Fetch output branch if it exists
          git fetch origin output:output 2>/dev/null || git checkout --orphan output

          # If output branch doesn't exist locally, create it
          if ! git show-ref --verify --quiet refs/heads/output; then
            git checkout --orphan output
            git rm -rf . || true
          else
            git checkout output
          fi

          # Copy the stats card
          git checkout main -- stats-card.svg

          # Commit and push
          git add stats-card.svg
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update stats card [$(date +'%Y-%m-%d')]" && git push origin output)
