name: Update GitHub Stats

on:
  schedule:
    - cron: '0 0 * * *'  # Runs daily at midnight UTC
  workflow_dispatch:      # Allows manual trigger

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Update README with stats
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: go run update-stats.go

      - name: Generate stats card SVG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: go run generate-stats-card.go

      - name: Commit stats card to output branch
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

          # Create/checkout output branch
          git fetch origin output || true
          git checkout -B output

          # Keep only the SVG file
          mkdir -p temp
          mv stats-card.svg temp/
          git rm -rf . || true
          mv temp/stats-card.svg .
          rm -rf temp

          # Commit and push
          git add stats-card.svg
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update stats card" && git push -f origin output)

          # Go back to main branch
          git checkout main

      - name: Commit README changes
        run: |
          git add README.md
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update GitHub stats" && git push)
