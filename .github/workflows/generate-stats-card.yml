name: Generate Stats Card

on:
  schedule:
    - cron: '0 0 * * *'  # Runs daily at midnight UTC
  workflow_dispatch:      # Allows manual trigger

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Generate stats card SVG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: go run generate-stats-card.go

      - name: Copy SVG to temp location
        run: |
          mkdir -p /tmp/stats
          cp stats-card.svg /tmp/stats/
          rm -f stats-card.svg

      - name: Checkout output branch
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

          # Fetch output branch if it exists
          if git ls-remote --heads origin output | grep output; then
            git fetch origin output
            git checkout output
          else
            git checkout --orphan output
            git rm -rf . || true
          fi

      - name: Update stats card
        run: |
          # Copy the SVG from temp
          cp /tmp/stats/stats-card.svg .

          # Commit and push
          git add stats-card.svg
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update stats card [$(date +'%Y-%m-%d')]" && git push origin output)
